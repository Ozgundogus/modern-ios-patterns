name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  test:
    name: Build & test (Swift 6, warnings as errors)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors
